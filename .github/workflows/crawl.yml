name: crawl

on:
  schedule:
    - cron: '23 * * * *' # 每小時增量（UTC 分鐘 23，避開整點壅塞；GitHub 實際約 1~4 小時跑一次）
    - cron: '7 18 * * *' # 每天 03:07 JST 完整掃站：補齊翻不到的舊品、把已售出/下架的メルカリ品項改成售完
  push:
    branches: [master] # 推程式碼時只重新匯出 + 部署，不掃站
  workflow_dispatch:
    inputs:
      full:
        description: '完整重掃（翻到底）'
        type: boolean
        default: false

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # keepalive 用

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Crawl all sites
        if: github.event_name != 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx tsx src/cli/index.ts crawl ${{ (inputs.full || github.event.schedule == '7 18 * * *') && '--full' || '' }}

      # 掃站中途失敗也照樣匯出部署已經寫進資料庫的部分
      - name: Export static snapshot
        id: export
        if: ${{ !cancelled() }}
        run: npx tsx scripts/export-static.mts

      # 公開站讀的是 public/snapshot，掃完不部署網站就不會更新。wrangler 只上傳內容有變的檔案
      # 匯出失敗就不部署，否則會把沒有 snapshot 的空站推上去
      - name: Deploy to Cloudflare
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，略過部署（公開站資料不會更新）"
            exit 0
          fi
          npx --yes wrangler@4 deploy
          # Worker 的通知訂閱 API 要連 Turso：非排程觸發（推程式、手動）時同步一次 secrets
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            printf '{"TURSO_DATABASE_URL":"%s","TURSO_AUTH_TOKEN":"%s"}' "$TURSO_DATABASE_URL" "$TURSO_AUTH_TOKEN" > "$RUNNER_TEMP/worker-secrets.json"
            npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/worker-secrets.json"
            rm -f "$RUNNER_TEMP/worker-secrets.json"
          fi

      # GitHub 會把 60 天沒有 commit 的 repo 的排程停掉；每次跑完重新 enable 一次重置計時
      - name: Keepalive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/crawl.yml/enable" || true
