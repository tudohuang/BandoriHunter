<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Bandori Hunter — バンドリ中古商品比價</title>
<meta name="description" content="BanG Dream! 中古／二手周邊比價：メルカリ、らしんばん、駿河屋、K-BOOKS、BOOKOFF、HARD OFF 六站整合搜尋、行情參考與降價追蹤。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2C9 2 4 5 4 10c0 8 8 18 12 20 4-2 12-12 12-20 0-5-5-8-12-8z' fill='%23e8336f'/><path d='M12 11h8M12 15h6' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="./" aria-label="Bandori Hunter 首頁">
      <svg class="logo-pick" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2C9 2 4 5 4 10c0 8 8 18 12 20 4-2 12-12 12-20 0-5-5-8-12-8z"/><path class="logo-lines" d="M12 11h8M12 15h6"/></svg>
      <span class="logo-text">
        <span class="logo-mark">Bandori Hunter</span>
        <span class="logo-sub">バンドリ中古比價・6 站整合</span>
      </span>
    </a>
    <div class="searchwrap">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
      <input id="searchInput" type="search" placeholder="搜尋商品、樂團、角色…（「-詞」可排除）" autocomplete="off" enterkeyhint="search">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <button id="liveBtn" class="btn btn-primary local-only" hidden title="即時查詢各網站的最新結果（約 10〜30 秒），並同步進資料庫">即時同步</button>
    <div class="topstats">
      <span class="fresh" id="freshPill"><i></i><span>讀取中…</span></span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切換深色模式" title="切換深色模式">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.5A6.5 6.5 0 017.5 4.5a6.5 6.5 0 108 8z"/></svg>
      </button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="分頁">
    <button class="tab active" data-tab="browse">全部商品</button>
    <button class="tab" data-tab="new">新上架 <span class="tabbadge" id="newBadge"></span></button>
    <button class="tab" data-tab="drops">降價中 <span class="tabbadge drop" id="dropBadge"></span></button>
    <button class="tab" data-tab="compare">比價・行情</button>
    <button class="tab" data-tab="wish">願望清單 <span class="tabbadge plain" id="wishBadge"></span></button>
    <button class="tab local-only" data-tab="watch" hidden>關注通知</button>
    <button class="tab local-only" data-tab="system" hidden>資料與設定</button>
    <label class="switch danmaku-switch" title="最近收錄的商品以彈幕飄過畫面，點擊可看詳情">
      <input type="checkbox" id="danmakuToggle"><span></span>彈幕
    </label>
  </nav>
</header>

<div class="layout">
  <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="關閉篩選"></button>
  <aside class="sidebar" id="sidebar">
    <div class="filter-head">
      <strong>篩選</strong>
      <button id="filterClose" class="icon-btn" type="button" aria-label="關閉篩選">&times;</button>
    </div>
    <section class="fgroup">
      <h4>來源網站</h4>
      <div id="sourceFilters" class="srclist"></div>
    </section>
    <section class="fgroup">
      <label class="switch"><input type="checkbox" id="instockOnly"><span></span>只看可購買</label>
    </section>
    <section class="fgroup">
      <h4>價格（日圓）</h4>
      <div class="pricerow">
        <input id="minPrice" type="number" inputmode="numeric" placeholder="最低" min="0">
        <span>–</span>
        <input id="maxPrice" type="number" inputmode="numeric" placeholder="最高" min="0">
      </div>
    </section>
    <section class="fgroup coupon">
      <h4>メルカリ優惠券試算 <span class="hint-inline" title="填入你手上的メルカリ優惠券，商品卡會顯示券後價，價格排序也以券後價計算">?</span></h4>
      <div class="coupon-row">
        <select id="couponType" aria-label="優惠券類型">
          <option value="none">不使用</option>
          <option value="pct">折扣 %</option>
          <option value="yen">折抵金額</option>
        </select>
        <input id="couponValue" type="number" inputmode="numeric" min="0" placeholder="10">
      </div>
      <div class="coupon-row" id="couponExtra" hidden>
        <input id="couponCap" type="number" inputmode="numeric" min="0" placeholder="折抵上限 ¥">
        <input id="couponMin" type="number" inputmode="numeric" min="0" placeholder="最低消費 ¥">
      </div>
    </section>
    <section class="fgroup">
      <h4>分類</h4>
      <div class="chips" id="categoryChips"></div>
    </section>
    <section class="fgroup">
      <h4>樂團・角色</h4>
      <div class="chips" id="tagChips"></div>
    </section>
    <section class="fgroup">
      <h4>聲優</h4>
      <div class="chips" id="seiyuuChips"></div>
    </section>
    <button id="clearFilters" class="btn btn-plain wide">清除所有條件</button>
    <button id="filterDone" class="btn btn-primary wide filter-done" type="button">查看結果</button>
  </aside>

  <main class="main">
    <div class="market" id="marketBar" hidden></div>
    <div class="resultbar">
      <span id="resultCount" class="resultcount"></span>
      <div class="activefilters" id="activeFilters"></div>
      <span id="liveStatus" class="livestatus"></span>
      <div class="resulttools">
        <button id="filterToggle" class="btn filter-toggle" type="button" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M6 10h8M8.5 15h3"/></svg>
          <span>篩選</span>
          <span class="filter-count" id="filterCount" hidden></span>
        </button>
        <button id="shareBtn" class="btn" type="button" title="複製目前搜尋條件的連結">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 12l4-4M7 9.5l-1.8 1.8a2.8 2.8 0 004 4L11 13.5M13 10.5l1.8-1.8a2.8 2.8 0 00-4-4L9 6.5"/></svg>
          <span>分享</span>
        </button>
        <select id="sortSel" aria-label="排序">
          <option value="newest">最新收錄</option>
          <option value="price_asc">價格低 → 高</option>
          <option value="price_desc">價格高 → 低</option>
          <option value="updated">最近確認</option>
        </select>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div id="sentinel" class="sentinel"></div>
    <div id="emptyState" class="empty" hidden>
      <p class="empty-title">沒有符合條件的商品</p>
      <p class="empty-hint">試試放寬篩選、換個寫法（例如日文「アクスタ」），或把排除詞拿掉。</p>
    </div>
  </main>
</div>

<footer class="footer">
  <p>收錄 メルカリ・らしんばん・駿河屋（Yahoo!店）・K-BOOKS・BOOKOFF・HARD OFF 的 BanG Dream! 相關中古／二手商品。價格與庫存以各網站為準，本站僅供比價參考。</p>
  <p id="footMeta"></p>
</footer>

<!-- 比價・行情 -->
<template id="compareTpl">
  <div class="panel panel-wide">
    <div class="panel-head">
      <h3>比價・行情</h3>
      <p class="hint">輸入關鍵字，同時比較六站在售最低價，並用售完紀錄（含メルカリ成交）估算行情。關鍵字越具體越準，例如「Roselia 法被 友希那」。</p>
    </div>
    <div class="addrow">
      <input id="compareInput" placeholder="例：燈 アクスタ、Ave Mujica 法被 -ポスター">
      <label class="switch"><input type="checkbox" id="compareInstock" checked><span></span>清單只列可購買</label>
      <button id="compareGo" class="btn btn-primary">比價</button>
    </div>
    <div id="cmpMarket"></div>
    <div class="cmp-summary" id="cmpSummary"></div>
    <div class="cmp-list" id="cmpList"></div>
  </div>
</template>

<!-- 關注分頁（本機） -->
<template id="watchTpl">
  <div class="panel">
    <div class="panel-head">
      <h3>關注關鍵字</h3>
      <p class="hint">定期掃站時若有新品命中關鍵字，會發 Windows 桌面通知；設定 Discord webhook 後也會推到手機。</p>
    </div>
    <div class="addrow">
      <input id="watchInput" placeholder="例：Roselia 法被、千早愛音、MyGO タオル">
      <button id="watchAdd" class="btn btn-primary">加入關注</button>
    </div>
    <ul class="watchlist" id="watchList"></ul>
  </div>
</template>

<!-- 系統分頁（本機） -->
<template id="systemTpl">
  <div class="panel">
    <div class="panel-head"><h3>資料更新</h3></div>
    <div class="btnrow">
      <button id="crawlBtn" class="btn btn-primary">立即更新（增量掃站）</button>
      <button id="crawlFullBtn" class="btn btn-plain">完整重掃（耗時較久）</button>
    </div>
    <pre class="crawllog" id="crawlLog"></pre>
    <div class="panel-head"><h3>Discord 通知（選用）</h3></div>
    <div class="addrow">
      <input id="webhookInput" placeholder="貼上 Discord webhook URL；留空表示只用 Windows 通知">
      <button id="webhookSave" class="btn btn-plain">儲存</button>
    </div>
    <div class="panel-head"><h3>自動更新頻率</h3></div>
    <div class="addrow">
      <label>每 <input id="intervalInput" type="number" min="1" max="24" class="numinput"> 小時掃站一次（serve 執行期間生效）</label>
      <button id="intervalSave" class="btn btn-plain">儲存</button>
    </div>
  </div>
</template>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="danmaku" id="danmaku" hidden></div>

<script src="app.js"></script>
</body>
</html>
